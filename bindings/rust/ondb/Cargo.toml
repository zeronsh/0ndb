[package]
name = "ondb"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Client for the 0ndb daemon over its local socket: typed ops, live event streams and host plugs"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"

[lints.rust]
unsafe_code = "forbid"
