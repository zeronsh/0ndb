[workspace]
resolver = "3"
members = ["crates/ondb-core", "crates/ondb-store", "crates/ondb", "crates/ondb-sync", "crates/ondb-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.88"

[workspace.dependencies]
ondb-core = { path = "crates/ondb-core" }
ondb-store = { path = "crates/ondb-store" }
ondb = { path = "crates/ondb" }
ondb-sync = { path = "crates/ondb-sync" }

anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
crossbeam-channel = "=0.5.17"
ignore = "=0.4.33"
imara-diff = "=0.2.0"
lz4_flex = "=0.14.0"
notify = "=8.2.0"
postcard = { version = "=1.1.3", features = ["use-std"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
sha1_smol = "=1.0.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
